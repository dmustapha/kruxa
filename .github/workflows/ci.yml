name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95.0", targets: wasm32-unknown-unknown, components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-near --version 0.23.0 --locked
      - run: ./scripts/build.sh
      - run: ./scripts/lint.sh
      - run: ./scripts/test.sh
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [services/indexer, services/api, services/venue, relayer]
    defaults: { run: { working-directory: "${{ matrix.pkg }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
      - run: npm test
