[package]
name = "kruxa-instant-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# NEP-330 source link: the public repository. Owner approved baking it in (Nov 14); explorers and SourceScan use it to verify the deployed wasm.
repository = "https://github.com/dmustapha/kruxa"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
kruxa-math = { path = "../../crates/kruxa-math" }
kruxa-logic = { path = "../../crates/kruxa-logic" }
kruxa-instant = { path = "../../crates/kruxa-instant" }
# raw_value lets a view return a hand-built JSON document (no serde_json::Value tree); features are additive with near-sdk's.
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
