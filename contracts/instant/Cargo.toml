[package]
name = "kruxa-instant-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# NEP-330 needs a non-empty value; the repo has no remote yet (DC-G). PLACEHOLDER until publication.
repository = "https://example.invalid/kruxa-pending-publication"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
kruxa-math = { path = "../../crates/kruxa-math" }
kruxa-logic = { path = "../../crates/kruxa-logic" }
kruxa-instant = { path = "../../crates/kruxa-instant" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
