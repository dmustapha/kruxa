openapi: 3.0.3
info:
  title: Kruxa indexer read API
  version: 1.3.0
  description: |
    Read-only JSON API over the Kruxa indexer (workstream I). Nothing here is authoritative:
    every number is a convenience view folded from NEP-297 `EVENT_JSON` logs (standard `kruxa`,
    version 1.0.0) of the core and market contracts. A judge can rebuild the fold from raw
    events; the launch `book_hash_folded` is checked against the contract's `book_hash`.
    The app degrades to direct RPC reads and baked snapshots if this service is down.

    Conventions
    - Base path `/api`. No authentication, no write methods, no keys held.
    - Amounts are decimal strings of integers in base units (USDC has 6 decimals, launch tokens 6 decimals) so u128 never loses precision.
    - Times are unix seconds (integers). Chain nanosecond values are divided by 1e9 and floored.
    - Every object that carries numbers has `source`: `"chain"` when every contributing event came from a NEAR block, `"fixture"` when any contributing event came from the offline fixture generator. UI must label fixture numbers as fixture data.
    - Every response carries `as_of` (the last indexed final block) so freshness is visible.
    - Errors are `{ "error": { "code": string, "message": string } }` with HTTP 400, 404 or 503.
    - Phase and tab (1.1.0, APP-SPEC 2.4): every launch has one `phase` and the `tab` that phase belongs to.
      `SCHEDULED` (opens_at in the future), `OPEN` (stage new or open), `WALK_WINDOW` (stage closing and now before walk_end),
      `AWAITING_SETTLE` (open and now at or after walk_end), `PASS` (verdict PASS, no pool yet), `TRADING` (PASS and pool open),
      `FAIL` (verdict FAIL or creation failed), `DISSOLVED`. Tabs: `live` = SCHEDULED, OPEN; `walk` = WALK_WINDOW, AWAITING_SETTLE;
      `trading` = TRADING; `passed` = PASS; `failed` = FAIL, DISSOLVED. Tabs are exclusive and cover every launch; `all` is every launch.
    - Names (1.1.0): `name` comes from the `name` field of `charter_created`; it is `null` until the core emits it (REQ in docs/interfaces/EVENTS.md). Nothing is invented.
    - Stage definitions (exclusive, evaluated at request time against `now`):
      `closing` = status open and (commit window ended, or fewer than 6 h to `walk_end`);
      `new` = open, not closing, opened less than 6 h ago;
      `open` = open, not closing, not new;
      `passed` = verdict PASS; `failed` = verdict FAIL, creation failed or dissolved.
      `all` (default) returns every stage. `has_market=true` narrows to launches whose pool is open.
    - Launch type (1.2.0, CHANGE-ORDER-7): `mode` is `trial` or `instant`. For a launch with an open pool `mode` is the market's authenticated pool `mode`
      (derived from the sender, never from a message); before the pool opens it is the launcher's `instant_created` event, or `trial` for core launches.
      Instant ids start at 1000000000 (always strings in JSON). An instant launch has NO verdict, NO Walk and NO trial: `verdict` is null, `funders` is 0,
      `total_active` is "0", `soft_cap` is null, `verdict_inputs` is null, `genesis` is null. Its lifecycle is carried by `phase`:
      `instant_creating` (token being made), `instant_pending_seed` (token ready, waiting for the creator's seed), `instant_pending_open` (seeded, pool legs not yet consumed),
      `instant_open` (pool open, trading), `instant_failed` (creation failed, abandoned or aborted). `stage` for instant launches is `launching`, `trading` or `failed`.
    - Tabs with instant launches (1.2.0): the five trial tabs are unchanged and exclusive; every launch is in exactly one tab. Instant launches add `launching`
      (instant_creating, instant_pending_seed, instant_pending_open), join `trading` (instant_open) and join `failed` (instant_failed). `tab=all` lists every launch except
      instant_failed ones, which CO-7 keeps out of the default feed; pass `include_failed=true` or `tab=failed` to see them. `launch_type=all|trial|instant` (alias `mode`) filters
      by launch type; with `launch_type=trial` every tab and count is exactly what 1.1.0 returned.
    - Operations and custody (1.3.0, additive only; every 1.2.0 field and path is unchanged): `/api/ops/*` expose the operating state, the 7-day upgrade queue, launch halts,
      force-resolves, solvency reports and owed balances folded from the core events listed in EVENTS.md "Operations and custody"; `/api/launch/{id}/custody` and
      `/api/launch/{id}/genesis` expose launch token custody and the genesis attempt history. `LaunchSummary.halted` is new. `Genesis` gained ceremony fields.
      `VerifyData.fold_ok` is now a boolean once a book event is indexed (the indexer replays the contract's rolling `book_hash` from the events alone); it still does not
      compare with `get_state`. Every state in `/api/ops/status` carries `observed`: false means no event of that kind was indexed, not that the contract was read.
    - Snapshot mode (1.3.0): `node services/api/src/snapshot.ts serve <dir>` serves pages baked by `snapshot.ts bake` at the same paths (no query string except
      `interval` on candles), read-only, with header `x-kruxa-data: snapshot` and `GET /api/health` returning `status: "snapshot"`. A page that was not baked answers
      404 `not_in_snapshot`; `/api/stream` answers 404 `snapshot_no_stream`. Label such data RECORDED in the app.
    - Candle price is quote (USDC) per whole token, a decimal number; `v` is quote volume in whole USDC.
      Candle shape is TradingView-datafeed compatible (`t,o,h,l,c,v`, `t` in unix seconds, bucket start, UTC).
servers:
  - url: http://localhost:8787
    description: local dev (default `PORT=8787`)
tags:
  - name: feed
  - name: token
  - name: creator
  - name: portfolio
  - name: verify
  - name: ops
paths:
  /api/health:
    get:
      tags: [ops]
      summary: Health and freshness
      description: Never 5xx while the process is alive. `status` is `ok` when the head lag is within `max_lag_blocks`, `stale` otherwise, `fixture` when the store was built from the offline generator.
      responses:
        '200':
          description: freshness report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/launches:
    get:
      tags: [feed]
      summary: Launch feed (new, open, closing, passed, failed) with search and filters
      parameters:
        - name: stage
          in: query
          schema: { type: string, enum: [all, new, open, closing, passed, failed, launching, trading], default: all }
        - name: tab
          in: query
          description: lifecycle tab (see Phase and tab above); combines with `stage` by intersection
          schema: { type: string, enum: [all, live, walk, launching, trading, passed, failed], default: all }
        - name: launch_type
          in: query
          description: 'trial, instant or all (default). `mode` is accepted as an alias.'
          schema: { type: string, enum: [all, trial, instant], default: all }
        - name: include_failed
          in: query
          description: with `tab=all`, also list instant_failed launches
          schema: { type: boolean, default: false }
        - name: q
          in: query
          description: case-insensitive substring over name, symbol, creator account, payout recipient account and numeric launch id
          schema: { type: string, maxLength: 64 }
        - name: creator
          in: query
          schema: { type: string }
        - name: has_market
          in: query
          schema: { type: boolean }
        - name: min_raised
          in: query
          description: minimum `total_active` in base units
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, raised, funders, ending_soon, volume_24h], default: newest }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: opaque `next_cursor` from the previous page
          schema: { type: string }
      responses:
        '200':
          description: a page of launches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/launch/{id}:
    get:
      tags: [feed]
      summary: Launch detail (charter, verdict inputs, margin, allocation)
      parameters: [ { $ref: '#/components/parameters/LaunchId' } ]
      responses:
        '200':
          description: launch detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /api/token/{id}:
    get:
      tags: [token]
      summary: Token page data in one call (summary, creator, payout recipient, pool, safety indicators)
      parameters: [ { $ref: '#/components/parameters/LaunchId' } ]
      responses:
        '200':
          description: token page summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPage' }
        '404': { $ref: '#/components/responses/Error' }
  /api/token/{id}/candles:
    get:
      tags: [token]
      summary: OHLCV candles
      parameters:
        - $ref: '#/components/parameters/LaunchId'
        - name: interval
          in: query
          schema: { type: string, enum: ['1m', '5m', '1h', '1d'], default: '1m' }
        - name: from
          in: query
          description: unix seconds, inclusive
          schema: { type: integer, minimum: 0 }
        - name: to
          in: query
          description: unix seconds, exclusive
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - name: fill
          in: query
          description: when true, empty buckets between the first and last candle are filled flat at the previous close with v=0 and `filled=true`
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: candles ascending by `t`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandleSeries' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/token/{id}/trades:
    get:
      tags: [token]
      summary: Trades feed from market `swap` events, newest first
      parameters:
        - $ref: '#/components/parameters/LaunchId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: opaque `next_cursor` from the previous page
          schema: { type: string }
        - name: trader
          in: query
          schema: { type: string }
      responses:
        '200':
          description: trades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeList' }
        '404': { $ref: '#/components/responses/Error' }
  /api/token/{id}/holders:
    get:
      tags: [token]
      summary: Holders of the launch token as folded from trial claims and market swaps
      description: Balances are trial-claimed plus net market flow. They are an indexed estimate, not a token-contract read (`basis` says so).
      parameters:
        - $ref: '#/components/parameters/LaunchId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: holders by balance descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolderList' }
        '404': { $ref: '#/components/responses/Error' }
  /api/token/{id}/depth:
    get:
      tags: [token]
      summary: Pool depth (reserves and a constant-product price-impact ladder)
      description: The ladder is computed from the latest indexed reserves with the constant-product formula and the fee in `fee_bps`. It is a quote estimate, never an execution guarantee; the contract's `min_out` is the protection.
      parameters: [ { $ref: '#/components/parameters/LaunchId' } ]
      responses:
        '200':
          description: depth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolDepth' }
        '404': { $ref: '#/components/responses/Error' }
  /api/creator/{account}:
    get:
      tags: [creator]
      summary: Creator desk (launches, earnings, claims, stream meter)
      description: Includes launches where `account` is the creator or the payout recipient. `payout_recipient` is shown per launch (PRD 4b.2).
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 128 }
      responses:
        '200':
          description: creator desk (empty `launches` when the account created or receives nothing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDesk' }
  /api/export/creator/{account}/claims.csv:
    get:
      tags: [creator]
      summary: Creator claims and stream draws as CSV
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: CSV with header `launch_id,kind,amount,block_height,receipt_id,time,source`
          content:
            text/csv:
              schema: { type: string }
  /api/portfolio/{account}:
    get:
      tags: [portfolio]
      summary: Portfolio by account (positions, funds in motion, claims, market balances)
      parameters:
        - name: account
          in: path
          required: true
          description: a NEAR account id or a holder key (`near:<account>` or `sol:<base58>`)
          schema: { type: string, minLength: 2, maxLength: 128 }
      responses:
        '200':
          description: portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
  /api/verify/{id}:
    get:
      tags: [verify]
      summary: Verify data (hashes, folded book check, event references)
      description: Lets a reader recompute the fold. `ledger_consistent` checks the indexed book against itself. `fold_ok` stays null because the indexer takes `book_hash` from the contract's own events and does not recompute it; the independent check is `verify.sh`.
      parameters: [ { $ref: '#/components/parameters/LaunchId' } ]
      responses:
        '200':
          description: verify data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyData' }
        '404': { $ref: '#/components/responses/Error' }
  /api/stats:
    get:
      tags: [ops]
      summary: Honest aggregates from indexed data only
      description: Every figure is a fold of indexed events and says so in `basis`. No figure is a projection. `pass_rate` is null until a launch has settled.
      responses:
        '200':
          description: aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
  /api/ops-log:
    get:
      tags: [ops]
      summary: Operator and operations events, newest first
      description: From indexed core, market and launcher events only. Pause and freeze, caps, config changes, launch halts, the upgrade queue, force-resolves, solvency reports, owed balances, token custody, refund routing and genesis ceremony events (list in EVENTS.md). It is a record of what the contracts logged, not a moderation list.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: opaque `next_cursor` from the previous page
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [core, market, launcher] }
        - name: category
          in: query
          description: 1.3.0
          schema: { type: string, enum: [pause, caps, config, halt, upgrade, force_resolve, solvency, owed, custody, refunds, genesis, treasury] }
        - name: launch_id
          in: query
          description: 1.3.0; only events whose data names this launch
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: log entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsLog' }
  /api/ops/status:
    get:
      tags: [ops]
      summary: Operating state in one read (status page, operator strip)
      description: |
        Core and launcher pause state (a freeze reads as `paused` after `until`), market pause, genesis pause and relayer, the market account, the creator gate, the cap state with any
        queued raise, the pending upgrade, halted launches, queued force-resolves, owed NEAR and the latest solvency report with its age. Folded from events only; `observed: false` means
        no event of that kind was indexed.
      responses:
        '200':
          description: operating state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsStatus' }
  /api/ops/upgrades:
    get:
      tags: [ops]
      summary: Core upgrade queue (7-day timelock)
      description: Newest first. `status` is queued, cancelled, applied or superseded (a new queue call replaces the pending one without an event). `pending` is the queued entry, if any.
      parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } } ]
      responses:
        '200':
          description: upgrades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpgradeList' }
  /api/ops/halts:
    get:
      tags: [ops]
      summary: Launch halts and resumes
      parameters:
        - { name: active, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: halts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HaltList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/ops/force-resolves:
    get:
      tags: [ops]
      summary: Force-resolves of stuck outbound legs (2-day timelock)
      description: The event names the launch, amount and ok flag but not the leg kind or holder, so an execution closes the oldest queued entry with the same three values.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, executed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: force-resolves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForceResolveList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/ops/solvency:
    get:
      tags: [ops]
      summary: Solvency reports logged by core `check_solvency`
      parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } } ]
      responses:
        '200':
          description: reports, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolvencyList' }
  /api/ops/owed:
    get:
      tags: [ops]
      summary: Owed balances (failed outbound pushes waiting to be claimed)
      description: Core owed NEAR (`token` NEAR) and market or launcher owed tokens. `balance` is credited minus claimed; zero balances are hidden unless `outstanding=false`.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [core, market, launcher] } }
        - { name: account, in: query, schema: { type: string } }
        - { name: outstanding, in: query, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
      responses:
        '200':
          description: owed balances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwedList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/launch/{id}/custody:
    get:
      tags: [feed]
      summary: Launch token custody and refund routing
      description: Creator allocation claimed (net of failed legs), sweeps with the burn mode, delivery refusals and failed legs, the stream including any lengthening, refund batches and Intents-routed refunds, refused orphan credits. Token balances at rest come from core views, not from here.
      parameters: [ { $ref: '#/components/parameters/LaunchId' } ]
      responses:
        '200':
          description: custody
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchCustody' }
        '404': { $ref: '#/components/responses/Error' }
  /api/launch/{id}/genesis:
    get:
      tags: [feed]
      summary: Genesis state with the full attempt history
      description: The `Genesis` object plus `history`, every genesis_committed, genesis_confirmed, genesis_aborted, genesis_reopened, f0_* and attest_log event in order. 404 for instant launches.
      parameters: [ { $ref: '#/components/parameters/LaunchId' } ]
      responses:
        '200':
          description: genesis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchGenesis' }
        '404': { $ref: '#/components/responses/Error' }
  /api/export/launches.csv:
    get:
      tags: [feed]
      summary: Open launch dataset (CSV)
      responses:
        '200':
          description: CSV with header `launch_id,symbol,creator,status,total_active,funders,verdict,source`
          content:
            text/csv:
              schema: { type: string }
  /api/export/trades.csv:
    get:
      tags: [token]
      summary: Open trades dataset (CSV)
      parameters:
        - name: launch_id
          in: query
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: CSV with header `launch_id,time,side,trader,amount_in,amount_out,price,fee_total,block_height,receipt_id,source`
          content:
            text/csv:
              schema: { type: string }
  /api/stream:
    get:
      tags: [token]
      summary: Server-sent events price stream
      description: |
        `text/event-stream`. Events: `hello` (once, with `as_of`), `trade` (a `Trade`), `candle` (the updated 1m `Candle` plus `launch_id`),
        `launch` (a `LaunchSummary` after any state change), `heartbeat` every 15 s. Each event has an `id` (the event store sequence number).
        A reconnecting client sends `Last-Event-ID` and receives the events after it that are still in the 1000-event ring buffer.
        A fixture-sourced event has `"source":"fixture"` in its JSON.
      parameters:
        - name: launch_id
          in: query
          description: filter to one launch; omit for all
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: event stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  parameters:
    LaunchId:
      name: id
      in: path
      required: true
      description: launch id (u64 as decimal)
      schema: { type: string, pattern: '^[0-9]{1,20}$' }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
    Source:
      type: string
      enum: [chain, fixture]
      description: '`fixture` when any contributing event came from the offline generator'
    AsOf:
      type: object
      required: [block_height, block_time]
      properties:
        block_height: { type: integer, nullable: true, description: 'last indexed final block, null for an empty store' }
        block_time: { type: integer, nullable: true, description: unix seconds of that block }
    Amount:
      type: string
      pattern: '^[0-9]+$'
      description: base-unit integer as a decimal string
    Health:
      type: object
      required: [status, network, source, as_of, head_height, lag_blocks, max_lag_blocks, event_count, state_hash, uptime_s]
      properties:
        status: { type: string, enum: [ok, stale, fixture] }
        network: { type: string, example: testnet, description: 'testnet, mainnet or fixture' }
        source: { $ref: '#/components/schemas/Source' }
        data_source: { type: string, example: neardata, description: 'neardata, rpc or fixture' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        head_height: { type: integer, nullable: true, description: 'chain head seen by the tailer; null offline' }
        lag_blocks: { type: integer, nullable: true }
        max_lag_blocks: { type: integer }
        event_count: { type: integer }
        launch_count: { type: integer }
        trade_count: { type: integer }
        state_hash: { type: string, description: 'sha256 hex of the canonical read model; equal inputs give equal hash' }
        last_error: { type: string, nullable: true }
        uptime_s: { type: integer }
    LaunchSummary:
      type: object
      required: [launch_id, symbol, creator, payout_recipient, status, stage, total_active, funders, source]
      properties:
        launch_id: { type: string }
        symbol: { type: string }
        creator: { type: string }
        payout_recipient: { type: string, description: 'Charter stream_recipient, defaults to the creator' }
        mode: { type: string, enum: [trial, instant], description: 'launch type; the market pool mode once a pool is open' }
        status: { type: string, enum: [creating, open, passed, failed, creation_failed, dissolved, token_ready, seeded, handoff, trading, abandoned, aborted], description: 'token_ready, seeded, handoff, trading, abandoned and aborted are instant statuses (INSTANT-ABI); creating and creation_failed are shared' }
        name: { type: string, nullable: true, description: 'token name from charter_created, null until emitted' }
        stage: { type: string, enum: [new, open, closing, passed, failed, launching, trading] }
        phase: { type: string, enum: [SCHEDULED, OPEN, WALK_WINDOW, AWAITING_SETTLE, PASS, TRADING, FAIL, DISSOLVED, instant_creating, instant_pending_seed, instant_pending_open, instant_open, instant_failed] }
        tab: { type: string, enum: [live, walk, launching, trading, passed, failed] }
        created_at: { type: integer, nullable: true }
        opens_at: { type: integer, nullable: true }
        commit_end: { type: integer, nullable: true }
        walk_end: { type: integer, nullable: true }
        total_active: { $ref: '#/components/schemas/Amount' }
        funders: { type: integer }
        soft_cap: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
        min_funders: { type: integer, nullable: true }
        progress_bps: { type: integer, nullable: true, description: 'total_active over soft_cap in basis points, capped at 20000' }
        verdict: { type: string, enum: [PASS, FAIL], nullable: true }
        has_market: { type: boolean }
        halted: { type: boolean, description: 'true while a `halted` event is not yet followed by `resumed` for this launch (1.3.0)' }
        last_price: { type: number, nullable: true }
        volume_24h: { type: number, description: 'quote volume in whole USDC over the last 24 h' }
        last_block: { type: integer }
        source: { $ref: '#/components/schemas/Source' }
    LaunchList:
      type: object
      required: [items, next_cursor, as_of, source]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LaunchSummary' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, description: 'matches before paging' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    VerdictInputs:
      type: object
      required: [total_active, funders, book_hash_folded]
      properties:
        total_active: { $ref: '#/components/schemas/Amount' }
        funders: { type: integer }
        soft_cap: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
        min_funders: { type: integer, nullable: true }
        margin_to_soft_cap: { type: string, nullable: true, description: 'signed integer string: total_active minus soft_cap' }
        margin_funders: { type: integer, nullable: true, description: 'funders minus min_funders' }
        book_hash_folded: { type: string, description: 'hex, latest book_hash logged by the contract (contributed or walked)' }
        inputs_hash: { type: string, nullable: true, description: 'hex, from the verdict event' }
    Allocation:
      type: object
      properties:
        accepted: { $ref: '#/components/schemas/Amount' }
        launch_fee: { $ref: '#/components/schemas/Amount' }
        lp_quote: { $ref: '#/components/schemas/Amount' }
        stream: { $ref: '#/components/schemas/Amount' }
        excess_pool: { $ref: '#/components/schemas/Amount' }
    LaunchDetail:
      allOf:
        - $ref: '#/components/schemas/LaunchSummary'
        - type: object
          required: [charter_hash, verdict_inputs]
          properties:
            charter_hash: { type: string }
            genesis: { allOf: [ { $ref: '#/components/schemas/Genesis' } ], nullable: true, description: 'null for instant launches (no Solana mint)' }
            verdict_inputs: { allOf: [ { $ref: '#/components/schemas/VerdictInputs' } ], nullable: true, description: 'null for instant launches (no trial, no verdict)' }
            instant: { allOf: [ { $ref: '#/components/schemas/InstantInfo' } ], nullable: true, description: 'present for instant launches only' }
            verdict_reasons: { type: array, items: { type: string }, description: 'FAIL reasons as logged' }
            allocation: { allOf: [ { $ref: '#/components/schemas/Allocation' } ], nullable: true }
            walked_total: { $ref: '#/components/schemas/Amount' }
            contributed_total: { $ref: '#/components/schemas/Amount' }
            timeline:
              type: array
              description: lifecycle events in order, each with the receipt that proves it
              items: { $ref: '#/components/schemas/EventRef' }
    EventRef:
      type: object
      required: [event, block_height, receipt_id, source]
      properties:
        event: { type: string, example: trial_opened }
        block_height: { type: integer }
        receipt_id: { type: string }
        log_index: { type: integer }
        time: { type: integer }
        source: { $ref: '#/components/schemas/Source' }
    SafetyIndicator:
      type: object
      required: [id, label, status, basis]
      properties:
        id:
          type: string
          enum: [verdict_passed, lp_in_pool, mint_authority_null, freeze_authority_null, payout_recipient_declared, market_not_paused, creator_fee_within_bound, verdict_inputs_hash_present, fixed_supply, creator_allocation_vesting, solana_mint_none]
          description: 'instant launches get lp_in_pool, fixed_supply, creator_allocation_vesting, solana_mint_none, payout_recipient_declared, market_not_paused and creator_fee_within_bound; never the verdict or authority tiles'
        label: { type: string }
        status: { type: string, enum: [pass, warn, fail, unknown] }
        basis: { type: string, enum: [event, derived, not_indexed], description: '`not_indexed` means no logged event carries the fact, so status is `unknown` and is never guessed' }
        detail: { type: string }
    PoolInfo:
      type: object
      required: [open, paused]
      properties:
        mode: { type: string, enum: [trial, instant], description: 'the market pool mode, derived by the market from the authenticated sender' }
        creator: { type: string, nullable: true, description: 'pool creator account from pool_opened (instant pools; null for older trial pools)' }
        token: { type: string, nullable: true, description: 'launch token account (from pool_opened)' }
        market: { type: string, nullable: true, description: 'market contract account that logged the pool' }
        total_supply: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true, description: 'base units, null until an event carries it' }
        fee_terms: { allOf: [ { $ref: '#/components/schemas/FeeTerms' } ], nullable: true, description: 'FeeTerms exactly as logged by pool_opened' }
        open: { type: boolean }
        paused: { type: boolean }
        opened_at: { type: integer, nullable: true }
        trade_from: { type: integer, nullable: true, description: 'announced open (instant pools): unix seconds of the first accepted buy, from pool_opened.trade_from_ns; null when trading opened with the pool' }
        quote_reserve: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
        token_reserve: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
        fee_bps: { type: integer, nullable: true }
        price: { type: number, nullable: true, description: 'reserve ratio, quote per whole token' }
        tvl_quote: { type: number, nullable: true, description: 'twice the quote reserve, whole USDC' }
    FeeTerms:
      type: object
      description: kruxa_logic::FeeTerms as logged (MARKET-ABI)
      additionalProperties: true
      properties:
        total_fee_bps: { type: integer }
        creator_bps: { type: integer }
        platform_bps: { type: integer }
        holders_bps: { type: integer }
        lp_bps: { type: integer }
        referral_bps: { type: integer }
        opening_fee_start_bps: { type: integer }
        opening_decay_minutes: { type: integer }
        fee_vest_bps: { type: integer }
        fee_vest_days: { type: integer }
    ExternalPool:
      type: object
      required: [venue, pool, url]
      properties:
        venue: { type: string, example: meteora }
        pool: { type: string }
        url: { type: string }
    WindowStats:
      type: object
      required: [buys, sells, volume, unique_traders]
      properties:
        change_pct: { type: number, nullable: true, description: 'last price in the window against the price at the window start; null with no trades' }
        high: { type: number, nullable: true }
        low: { type: number, nullable: true }
        buys: { type: integer }
        sells: { type: integer }
        buy_volume: { type: number, description: 'whole USDC' }
        sell_volume: { type: number, description: 'whole USDC' }
        volume: { type: number, description: 'whole USDC' }
        unique_traders: { type: integer }
    Vesting:
      type: object
      description: creator allocation vesting folded from instant_created, instant_opened and alloc_claimed; the launcher's get_vesting view is the authority
      required: [total, unlocked, claimed, claimable]
      properties:
        recipient: { type: string }
        total: { $ref: '#/components/schemas/Amount' }
        cliff_days: { type: integer }
        vest_days: { type: integer }
        creator_alloc_bps: { type: integer }
        cliff_end: { type: integer, nullable: true, description: 'unix seconds, null before the pool opens' }
        vest_end: { type: integer, nullable: true }
        unlocked: { $ref: '#/components/schemas/Amount' }
        claimed: { $ref: '#/components/schemas/Amount' }
        claimable: { $ref: '#/components/schemas/Amount' }
        next_unlock_at: { type: integer, nullable: true, description: 'cliff end while locked, else null (vesting is linear after the cliff)' }
        day_seconds: { type: integer, description: 'seconds per vesting day assumed by this API (86400 except on the demo profile)' }
    InstantInfo:
      type: object
      required: [status, steps, seed, vesting]
      properties:
        status: { type: string }
        token: { type: string, nullable: true }
        supply_model: { type: string, example: near_factory_fixed }
        solana_mint: { type: string, enum: [none], description: 'instant launches have no Solana mint' }
        trade_delay_secs: { type: integer, description: 'announced open the creator declared at creation (instant_created.trade_delay_secs); 0 = trading opens with the pool' }
        total_supply: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
        creator_alloc: { $ref: '#/components/schemas/Amount' }
        pool_tokens: { $ref: '#/components/schemas/Amount' }
        seed:
          type: object
          properties:
            seed_q: { $ref: '#/components/schemas/Amount' }
            launch_fee: { $ref: '#/components/schemas/Amount' }
            pool_seed_q: { $ref: '#/components/schemas/Amount' }
            note: { type: string, example: 'locked in the pool permanently, not withdrawable' }
        vesting: { $ref: '#/components/schemas/Vesting' }
        steps:
          type: array
          description: Created, Seeded, Trading with the receipt that proves each (null until it happens)
          items:
            type: object
            required: [step, done]
            properties:
              step: { type: string, enum: [created, seeded, trading] }
              done: { type: boolean }
              block_height: { type: integer, nullable: true }
              receipt_id: { type: string, nullable: true }
              time: { type: integer, nullable: true }
        failure: { type: string, nullable: true, description: 'creation_failed, abandoned or aborted when the launch is dead' }
        source: { $ref: '#/components/schemas/Source' }
    Genesis:
      type: object
      description: |
        Solana genesis progress for a launch, folded from core events `genesis_committed` and `genesis_confirmed` (proposed, see EVENTS.md).
        `stage`: `none` (verdict FAIL, creation failed, dissolved, or no verdict yet; no Solana mint exists), `pending` (verdict PASS, no genesis event yet),
        `committed` (spec hash logged), `confirmed` (mint logged). Any fact no event carries is `null` or `unknown`, never guessed.
      required: [stage, network, path, verdict_inputs, mint_authority, freeze_authority, verified_checks, source]
      properties:
        stage: { type: string, enum: [none, pending, committed, confirmed, aborted] }
        merkle_root: { type: string, nullable: true }
        signatures: { type: array, items: { type: string }, description: 'confirm signatures as logged by genesis_confirmed' }
        slot: { type: string, nullable: true }
        ceremony_hash: { type: string, nullable: true }
        leaf_count: { type: integer, nullable: true }
        network: { type: string, nullable: true, example: solana-devnet }
        path: { type: string, nullable: true, enum: [F0, F1, null] }
        spec_hash: { type: string, nullable: true }
        mint: { type: string, nullable: true, description: 'Solana mint address' }
        tx_create: { type: string, nullable: true }
        tx_authority: { type: string, nullable: true }
        distributor: { type: string, nullable: true }
        root: { type: string, nullable: true, description: 'distribution merkle root' }
        mint_authority: { type: string, enum: ['null', set, unknown], description: '`null` means revoked' }
        freeze_authority: { type: string, enum: ['null', set, unknown] }
        verified_checks: { type: array, items: { type: string } }
        verdict_inputs:
          type: object
          description: the NEAR verdict inputs the genesis rests on
          properties:
            total_active: { $ref: '#/components/schemas/Amount' }
            funders: { type: integer }
            soft_cap: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
            min_funders: { type: integer, nullable: true }
            inputs_hash: { type: string, nullable: true }
            verdict: { type: string, enum: [PASS, FAIL], nullable: true }
        updated_at: { type: integer, nullable: true }
        max_total_claim: { type: string, nullable: true, description: 'from genesis_committed (1.3.0)' }
        reopen_count: { type: integer, description: 'how many times the owner reopened an aborted genesis (genesis_reopened); the record resets to pending each time (1.3.0)' }
        reopened_at: { type: integer, nullable: true }
        abort: { type: object, nullable: true, description: 'set while the genesis stands aborted', properties: { reason: { type: string }, by: { type: string } } }
        f0:
          type: object
          description: F0 ceremony data from f0_message_registered and f0_sign_requested for the current attempt
          properties:
            messages: { type: array, items: { type: object, properties: { tx_index: { type: integer }, message_sha256: { type: string } } } }
            sign_requests: { type: array, items: { type: integer } }
        attestations: { type: array, items: { type: string }, description: 'attest_log hashes for the current attempt' }
        source: { $ref: '#/components/schemas/Source' }
    Stats:
      type: object
      required: [launches, volume, basis, as_of, source]
      description: '`launches`, `committed` and `volume` are TRIAL-only (as in 1.1.0, when only trials existed). `instant` and `combined` are new in 1.2.0 and never mix into the trial figures.'
      properties:
        instant:
          type: object
          properties:
            launches:
              type: object
              properties:
                total: { type: integer }
                by_phase: { type: object, additionalProperties: { type: integer } }
                open: { type: integer }
                failed: { type: integer }
            seeds_declared: { $ref: '#/components/schemas/Amount', description: 'sum of seed_q over instant launches that reached an open pool' }
            alloc_claimed: { $ref: '#/components/schemas/Amount' }
            volume:
              type: object
              properties:
                trades: { type: integer }
                quote_volume: { type: number }
                unique_traders: { type: integer }
                fees_total: { $ref: '#/components/schemas/Amount' }
            source: { $ref: '#/components/schemas/Source' }
        combined:
          type: object
          description: all modes together, for headline counters only
          properties:
            launches: { type: integer }
            trades: { type: integer }
            quote_volume: { type: number }
            by_mode: { type: object, additionalProperties: { type: integer } }
            source: { $ref: '#/components/schemas/Source' }
        launches:
          type: object
          properties:
            total: { type: integer }
            by_phase: { type: object, additionalProperties: { type: integer } }
            by_tab: { type: object, additionalProperties: { type: integer } }
            passed: { type: integer }
            failed: { type: integer }
            pass_rate_bps: { type: integer, nullable: true, description: 'passed over (passed + failed), null until one has settled' }
        committed:
          type: object
          properties:
            total_committed: { $ref: '#/components/schemas/Amount' }
            total_walked: { $ref: '#/components/schemas/Amount' }
            active_in_open_trials: { $ref: '#/components/schemas/Amount' }
            refunds_paid: { $ref: '#/components/schemas/Amount' }
            refund_attempts_failed: { $ref: '#/components/schemas/Amount', description: 'sum of refund payouts logged with ok=false (retryable); not an outstanding balance' }
        volume:
          type: object
          properties:
            trades: { type: integer }
            quote_volume: { type: number, description: 'whole USDC, gross' }
            unique_traders: { type: integer }
            fees_total: { $ref: '#/components/schemas/Amount' }
            fee_slices:
              type: object
              properties:
                creator: { $ref: '#/components/schemas/Amount' }
                platform: { $ref: '#/components/schemas/Amount' }
                holders: { $ref: '#/components/schemas/Amount' }
                lp: { $ref: '#/components/schemas/Amount' }
                referral: { $ref: '#/components/schemas/Amount' }
        since_block: { type: integer, nullable: true, description: 'first block that carried an indexed event; nothing earlier is counted' }
        basis: { type: string }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    OpsLog:
      type: object
      required: [items, next_cursor, as_of, source]
      properties:
        items:
          type: array
          items:
            type: object
            required: [event, scope, contract, summary, data, block_height, receipt_id, time, source]
            properties:
              event: { type: string, example: paused }
              category: { type: string, enum: [pause, caps, config, halt, upgrade, force_resolve, solvency, owed, custody, refunds, genesis, treasury], description: '1.3.0' }
              launch_id: { type: string, nullable: true, description: 'from the event data when it names a launch (1.3.0)' }
              scope: { type: string, enum: [core, market, launcher] }
              contract: { type: string }
              summary: { type: string }
              data: { type: object, additionalProperties: true }
              block_height: { type: integer }
              receipt_id: { type: string }
              time: { type: integer }
              source: { $ref: '#/components/schemas/Source' }
        next_cursor: { type: string, nullable: true }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    TokenPage:
      type: object
      required: [launch, pool, safety, stats, genesis, external_pools, as_of, source]
      properties:
        genesis: { allOf: [ { $ref: '#/components/schemas/Genesis' } ], nullable: true, description: 'null for instant launches' }
        instant: { allOf: [ { $ref: '#/components/schemas/InstantInfo' } ], nullable: true, description: 'present for instant launches: steps, creator allocation vesting, seed' }
        external_pools:
          type: array
          description: venues where the token also trades, only when an indexed `external_pool` event names one; empty otherwise
          items: { $ref: '#/components/schemas/ExternalPool' }
        launch: { $ref: '#/components/schemas/LaunchSummary' }
        pool: { $ref: '#/components/schemas/PoolInfo' }
        stats:
          type: object
          properties:
            last_price: { type: number, nullable: true }
            change_24h_pct: { type: number, nullable: true }
            high_24h: { type: number, nullable: true }
            low_24h: { type: number, nullable: true }
            volume_24h: { type: number }
            trades_24h: { type: integer }
            windows:
              type: object
              description: 5m, 1h, 6h and 24h price stats with buy-vs-sell counts and volume
              additionalProperties: { $ref: '#/components/schemas/WindowStats' }
            fees_total: { $ref: '#/components/schemas/Amount' }
        creator:
          type: object
          properties:
            account: { type: string }
            payout_recipient: { type: string }
            creator_claimed: { $ref: '#/components/schemas/Amount' }
        safety:
          type: array
          items: { $ref: '#/components/schemas/SafetyIndicator' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    Candle:
      type: object
      required: [t, o, h, l, c, v, source]
      properties:
        t: { type: integer, description: bucket start, unix seconds UTC }
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v: { type: number, description: quote volume in whole USDC }
        n: { type: integer, description: trade count }
        filled: { type: boolean, description: 'true for a synthetic flat bucket (fill=true)' }
        source: { $ref: '#/components/schemas/Source' }
    CandleSeries:
      type: object
      required: [launch_id, interval, candles, as_of, source]
      properties:
        launch_id: { type: string }
        interval: { type: string, enum: ['1m', '5m', '1h', '1d'] }
        candles:
          type: array
          items: { $ref: '#/components/schemas/Candle' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    Trade:
      type: object
      required: [launch_id, side, trader, amount_in, amount_out, price, fee_total, block_height, receipt_id, time, source]
      properties:
        launch_id: { type: string }
        side: { type: string, enum: [buy, sell] }
        trader: { type: string }
        declared: { type: boolean, description: 'true when the trader is the launch creator or payout recipient account' }
        declared_as: { type: string, enum: [creator, payout_recipient, both], nullable: true }
        amount_in: { $ref: '#/components/schemas/Amount' }
        amount_out: { $ref: '#/components/schemas/Amount' }
        price: { type: number, description: quote per whole token }
        quote_amount: { $ref: '#/components/schemas/Amount' }
        token_amount: { $ref: '#/components/schemas/Amount' }
        fee_total: { $ref: '#/components/schemas/Amount' }
        fee_slices:
          type: object
          description: five-slice fee cut when logged
          properties:
            creator: { $ref: '#/components/schemas/Amount' }
            platform: { $ref: '#/components/schemas/Amount' }
            holders: { $ref: '#/components/schemas/Amount' }
            lp: { $ref: '#/components/schemas/Amount' }
            referral: { $ref: '#/components/schemas/Amount' }
            surcharge: { $ref: '#/components/schemas/Amount' }
            red_holders: { $ref: '#/components/schemas/Amount', description: 'part of lp: the holders slice redirected to liquidity in this release' }
            red_referral: { $ref: '#/components/schemas/Amount', description: 'part of lp: the referral slice redirected to liquidity in this release' }
        quote_reserve_after: { $ref: '#/components/schemas/Amount' }
        token_reserve_after: { $ref: '#/components/schemas/Amount' }
        block_height: { type: integer }
        receipt_id: { type: string }
        time: { type: integer }
        source: { $ref: '#/components/schemas/Source' }
    TradeList:
      type: object
      required: [items, next_cursor, as_of, source]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Trade' }
        next_cursor: { type: string, nullable: true }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    HolderList:
      type: object
      required: [items, basis, as_of, source]
      properties:
        basis: { type: string, example: 'trial claims plus net market flow, indexed estimate' }
        unclaimed_allocation: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true, description: 'instant launches: creator allocation still held by the launcher (locked or claimable), not in `items`' }
        holder_count: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [holder, balance, share_bps]
            properties:
              holder: { type: string }
              balance: { $ref: '#/components/schemas/Amount' }
              share_bps: { type: integer }
              is_creator: { type: boolean }
              is_pool: { type: boolean }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    PoolDepth:
      type: object
      required: [pool, ladder, as_of, source]
      properties:
        pool: { $ref: '#/components/schemas/PoolInfo' }
        ladder:
          type: array
          description: hypothetical trades of growing size against the latest reserves
          items:
            type: object
            required: [side, amount_in, amount_out, price_impact_bps]
            properties:
              side: { type: string, enum: [buy, sell] }
              amount_in: { $ref: '#/components/schemas/Amount' }
              amount_out: { $ref: '#/components/schemas/Amount' }
              avg_price: { type: number }
              price_impact_bps: { type: integer }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    StreamMeter:
      type: object
      description: Stream-lite meter folded from `pass_allocated` and `payout_resolved` events at `now`. The contract's `stream_status` view is the authority for what is drawable.
      required: [total, drawn, unlocked, drawable_estimate, starts_at, ends_at]
      properties:
        recipient: { type: string }
        total: { $ref: '#/components/schemas/Amount' }
        drawn: { $ref: '#/components/schemas/Amount' }
        unlocked: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true, description: 'null when the charter stream length was not logged' }
        drawable_estimate: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
        starts_at: { type: integer }
        ends_at: { type: integer, nullable: true }
        progress_bps: { type: integer, nullable: true }
    CreatorLaunch:
      type: object
      required: [launch, role, earnings]
      properties:
        launch: { $ref: '#/components/schemas/LaunchSummary' }
        role: { type: string, enum: [creator, payout_recipient, both] }
        stream: { allOf: [ { $ref: '#/components/schemas/StreamMeter' } ], nullable: true }
        allocation: { allOf: [ { $ref: '#/components/schemas/Vesting' } ], nullable: true, description: 'instant launches: creator allocation vest meter' }
        earnings:
          type: object
          properties:
            market_fees_creator_slice: { $ref: '#/components/schemas/Amount' }
            claimed: { $ref: '#/components/schemas/Amount' }
            claimable_estimate: { $ref: '#/components/schemas/Amount' }
            stream_drawn: { $ref: '#/components/schemas/Amount' }
            alloc_claimed: { $ref: '#/components/schemas/Amount' }
    CreatorDesk:
      type: object
      required: [account, launches, totals, claims, as_of, source]
      properties:
        account: { type: string }
        launches:
          type: array
          items: { $ref: '#/components/schemas/CreatorLaunch' }
        totals:
          type: object
          properties:
            stream_drawn: { $ref: '#/components/schemas/Amount' }
            market_fees_creator_slice: { $ref: '#/components/schemas/Amount' }
            claimed: { $ref: '#/components/schemas/Amount' }
            alloc_claimed: { $ref: '#/components/schemas/Amount' }
        claims:
          type: array
          items:
            type: object
            required: [launch_id, kind, amount, block_height, receipt_id, time, source]
            properties:
              launch_id: { type: string }
              kind: { type: string, enum: [stream_draw, creator_claimed, alloc_claim] }
              amount: { $ref: '#/components/schemas/Amount' }
              block_height: { type: integer }
              receipt_id: { type: string }
              time: { type: integer }
              source: { $ref: '#/components/schemas/Source' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    PortfolioPosition:
      type: object
      required: [launch, contributed, walked, status]
      properties:
        launch: { $ref: '#/components/schemas/LaunchSummary' }
        contributed: { $ref: '#/components/schemas/Amount' }
        walked: { $ref: '#/components/schemas/Amount' }
        active: { $ref: '#/components/schemas/Amount' }
        tokens_claimed: { $ref: '#/components/schemas/Amount' }
        status:
          type: string
          enum: [active, walked, awaiting_settle, refundable, claimable, claimed, market_only]
        market_balance: { $ref: '#/components/schemas/Amount' }
        market_value_quote: { type: number, nullable: true }
    Portfolio:
      type: object
      required: [account, positions, funds_in_motion, as_of, source]
      properties:
        account: { type: string }
        positions:
          type: array
          items: { $ref: '#/components/schemas/PortfolioPosition' }
        funds_in_motion:
          type: array
          description: payouts logged as `payout_resolved` with ok=false or deposits rejected and refunded
          items:
            type: object
            properties:
              launch_id: { type: string }
              kind: { type: string }
              amount: { $ref: '#/components/schemas/Amount' }
              ok: { type: boolean }
              receipt_id: { type: string }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    PauseState:
      type: object
      properties:
        state: { type: string, enum: [live, paused, frozen] }
        effective_state: { type: string, enum: [live, paused, frozen], description: 'a freeze past `until` reads as paused' }
        observed: { type: boolean }
        by: { type: string, nullable: true }
        until: { type: integer, nullable: true }
        since: { type: integer, nullable: true }
    CapState:
      type: object
      properties:
        value: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true, description: 'last applied or lowered value seen' }
        queued: { type: object, nullable: true, properties: { value: { $ref: '#/components/schemas/Amount' }, effective_at: { type: integer, nullable: true }, queued_at: { type: integer } } }
        changed_at: { type: integer, nullable: true }
        observed: { type: boolean }
    SolvencyReport:
      type: object
      properties:
        at: { type: integer, nullable: true, description: 'report time from the event' }
        time: { type: integer, description: 'block time' }
        ok: { type: boolean }
        intents_alert: { type: boolean }
        native: { type: object, nullable: true, properties: { balance: { $ref: '#/components/schemas/Amount' }, liability: { $ref: '#/components/schemas/Amount' }, ok: { type: boolean } } }
        intents: { type: object, nullable: true, properties: { balance: { $ref: '#/components/schemas/Amount' }, liability: { $ref: '#/components/schemas/Amount' }, ok: { type: boolean } } }
        age_s: { type: integer, description: 'only in /api/ops/status' }
        block_height: { type: integer }
        receipt_id: { type: string }
        source: { $ref: '#/components/schemas/Source' }
    Upgrade:
      type: object
      properties:
        code_hash: { type: string }
        status: { type: string, enum: [queued, cancelled, applied, superseded] }
        queued_at: { type: integer }
        effective_at: { type: integer, nullable: true }
        resolved_at: { type: integer, nullable: true }
        resolved_by: { type: string, nullable: true }
        block_height: { type: integer }
        source: { $ref: '#/components/schemas/Source' }
    OpsStatus:
      type: object
      properties:
        core: { $ref: '#/components/schemas/PauseState' }
        launcher: { $ref: '#/components/schemas/PauseState' }
        market: { type: object, properties: { paused: { type: boolean }, observed: { type: boolean }, by: { type: string, nullable: true }, since: { type: integer, nullable: true } } }
        genesis: { type: object, properties: { paused: { type: boolean }, relayer: { type: string, nullable: true } } }
        market_account: { type: object, properties: { core: { type: string, nullable: true }, launcher: { type: string, nullable: true } } }
        creator_gate: { type: object, properties: { core_open: { type: boolean }, launcher_open: { type: boolean } } }
        caps: { type: object, properties: { global: { $ref: '#/components/schemas/CapState' }, launch: { $ref: '#/components/schemas/CapState' } } }
        pending_upgrade: { allOf: [ { $ref: '#/components/schemas/Upgrade' } ], nullable: true }
        halted_launches: { type: array, items: { type: string } }
        force_resolves_queued: { type: integer }
        owed: { type: object, properties: { near_total_yocto: { type: string }, open_balances: { type: integer } } }
        solvency: { allOf: [ { $ref: '#/components/schemas/SolvencyReport' } ], nullable: true }
        since_block: { type: integer, nullable: true }
        basis: { type: string }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    UpgradeList:
      type: object
      properties:
        pending: { allOf: [ { $ref: '#/components/schemas/Upgrade' } ], nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/Upgrade' } }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    HaltList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              launch_id: { type: string }
              halted: { type: boolean }
              reason: { type: string, nullable: true }
              halted_by: { type: string, nullable: true }
              halted_at: { type: integer, nullable: true }
              resumed_at: { type: integer, nullable: true }
              halt_count: { type: integer }
              source: { $ref: '#/components/schemas/Source' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    ForceResolveList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              launch_id: { type: string }
              amount: { $ref: '#/components/schemas/Amount' }
              ok: { type: boolean }
              state: { type: string, enum: [queued, executed] }
              queued_at: { type: integer, nullable: true }
              effective_at: { type: integer, nullable: true }
              executed_at: { type: integer, nullable: true }
              evidence: { type: string, nullable: true }
              block_height: { type: integer }
              source: { $ref: '#/components/schemas/Source' }
        basis: { type: string }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    SolvencyList:
      type: object
      properties:
        latest: { allOf: [ { $ref: '#/components/schemas/SolvencyReport' } ], nullable: true }
        failing: { type: integer, description: 'reports with ok=false in this page' }
        items: { type: array, items: { $ref: '#/components/schemas/SolvencyReport' } }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    OwedList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              scope: { type: string, enum: [core, market, launcher] }
              account: { type: string }
              token: { type: string, description: 'NEAR for core owed NEAR, otherwise the token account' }
              credited: { $ref: '#/components/schemas/Amount' }
              claimed: { $ref: '#/components/schemas/Amount' }
              balance: { $ref: '#/components/schemas/Amount' }
              updated_at: { type: integer }
              source: { $ref: '#/components/schemas/Source' }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    LaunchCustody:
      type: object
      properties:
        launch_id: { type: string }
        mode: { type: string, enum: [trial, instant] }
        token: { type: string, nullable: true }
        payout_recipient: { type: string }
        status: { type: string }
        halted: { type: boolean }
        creator_allocation: { type: object, properties: { claimed: { $ref: '#/components/schemas/Amount' }, recipient: { type: string } } }
        sweep: { type: object, properties: { swept: { $ref: '#/components/schemas/Amount' }, mode: { type: string, nullable: true, description: 'burn mode logged with the sweep: hold, sink:<account>' } } }
        stream:
          type: object
          properties:
            total: { $ref: '#/components/schemas/Amount' }
            drawn: { $ref: '#/components/schemas/Amount' }
            planned_days: { type: integer, nullable: true }
            lengthened: { type: integer }
            end_at: { type: integer, nullable: true }
            unlocked_at_change: { allOf: [ { $ref: '#/components/schemas/Amount' } ], nullable: true }
            changed_at: { type: integer, nullable: true }
        deliveries:
          type: object
          properties:
            refused: { type: integer }
            failed_legs: { type: array, items: { type: object, properties: { kind: { type: string }, amount: { $ref: '#/components/schemas/Amount' }, time: { type: integer }, receipt_id: { type: string } } } }
        refunds: { type: object, properties: { batches: { type: integer }, handled: { type: integer }, paid: { type: integer }, routed_to_intents: { type: integer } } }
        orphan_credits_refused: { type: integer }
        deposits_refused_refundable: { type: integer }
        events: { type: array, items: { type: object, additionalProperties: true } }
        basis: { type: string }
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
    LaunchGenesis:
      allOf:
        - { $ref: '#/components/schemas/Genesis' }
        - type: object
          properties:
            launch_id: { type: string }
            history: { type: array, items: { type: object, additionalProperties: true, description: 'EventRef plus the raw event data' } }
            as_of: { $ref: '#/components/schemas/AsOf' }
    VerifyData:
      type: object
      required: [launch_id, fold_ok, ledger_consistent, events, as_of, source]
      properties:
        launch_id: { type: string }
        charter_hash: { type: string }
        inputs_hash: { type: string, nullable: true }
        book_hash_folded: { type: string }
        book_hash_stored: { type: string, nullable: true, description: 'hash from a chain get_state view, null until such a comparison runs' }
        book_hash_recomputed: { type: string, nullable: true, description: 'rolling book hash replayed by the indexer from contributed and walked events (null before the first one) (1.3.0)' }
        fold_ok: { type: boolean, nullable: true, description: 'true when the replayed hash equals the logged hash at every book event, false from the first disagreement, null when no book event is indexed or the launch is instant. Not a comparison with get_state (1.3.0)' }
        fold_events: { type: integer, description: 'book events replayed (1.3.0)' }
        fold_first_mismatch_block: { type: integer, nullable: true, description: 'block height of the first disagreement (1.3.0)' }
        fold_note: { type: string }
        mode: { type: string, enum: [trial, instant] }
        ledger_consistent: { type: boolean, nullable: true, description: 'null for instant launches (no book); otherwise indexed positions sum to total_active and the active holder count equals funders' }
        book_events: { type: integer }
        verdict: { type: string, enum: [PASS, FAIL], nullable: true }
        event_count: { type: integer }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventRef' }
        recompute:
          type: string
          example: './scripts/verify.sh 1 --launch 7'
        as_of: { $ref: '#/components/schemas/AsOf' }
        source: { $ref: '#/components/schemas/Source' }
