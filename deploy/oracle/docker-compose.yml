# Kruxa backend on one Oracle Cloud VM: indexer + API (one process, one SQLite file) behind Caddy (automatic TLS).
# Run from this directory:  cp compose.env.example .env && cp indexer.env.example indexer.env  (fill both), then  docker compose up -d --build
# The image is built from ops/Dockerfile at the repo root (Node 24, zero runtime dependencies, healthcheck on /api/health).
# The keeper and the genesis watcher are in the "daemons" profile: they do not start with a plain `docker compose up`.
# Start them with:  cp keeper.env.example keeper.env; cp watcher.env.example watcher.env  (fill both), then  docker compose --profile daemons up -d --build keeper watcher
# Both run in dry-run until KEEPER_SEND=1 / WATCHER_SEND=1. Keys are files under KRUXA_SECRETS_HOST, never in an env file. See docs/runbooks/keeper-watcher.md.
name: kruxa

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  indexer:
    build:
      context: ../..
      dockerfile: ops/Dockerfile
    image: kruxa-indexer:local
    restart: unless-stopped
    env_file: ./indexer.env
    environment:
      KRUXA_DB: /data/indexer.db
      PORT: "8787"
      HOST: 0.0.0.0
    volumes:
      - ${KRUXA_DATA_HOST:-/srv/kruxa/data}:/data
    ports:
      - "127.0.0.1:8787:8787"   # loopback only: for curl on the VM. The public path is Caddy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s     # the process closes SQLite cleanly on SIGTERM
    logging: *logging

  keeper:
    profiles: ["daemons"]
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.keeper
    image: kruxa-keeper:local
    restart: unless-stopped
    env_file: ./keeper.env
    volumes:
      - ${KRUXA_SECRETS_HOST:-/srv/kruxa/secrets}:/secrets:ro
    stop_grace_period: 20s
    logging: *logging

  watcher:
    profiles: ["daemons"]
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.watcher
    image: kruxa-watcher:local
    restart: unless-stopped
    env_file: ./watcher.env
    volumes:
      - ${KRUXA_SECRETS_HOST:-/srv/kruxa/secrets}:/secrets:ro
      - ${KRUXA_DATA_HOST:-/srv/kruxa/data}/watcher:/data
    stop_grace_period: 20s
    logging: *logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      indexer: { condition: service_healthy }
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume or Let's Encrypt rate limits bite
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
